<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Snake Game</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="assets/css/serpiente.css"
  >

</head>

<body>

  <main class="container py-4">

    <!-- HEADER -->
    <section class="hero text-center mb-4">

      <h1 class="titulo">
        🐍 Snake Game
      </h1>

      <p class="subtitulo">
        Recolecta comida, consigue monedas y desbloquea nuevas skins.
      </p>

    </section>

    <!-- PANEL INFO -->
    <section class="row g-3 mb-4">

      <div class="col-md-2 col-6">
        <div class="card-info">
          <span>Puntaje</span>
          <strong id="puntaje">0</strong>
        </div>
      </div>

      <div class="col-md-2 col-6">
        <div class="card-info">
          <span>Monedas</span>
          <strong id="monedas">0</strong>
        </div>
      </div>

      <div class="col-md-2 col-6">
        <div class="card-info">
          <span>Estado</span>
          <strong id="estado">Listo</strong>
        </div>
      </div>

      <div class="col-md-3 col-6">
        <a href="tienda.html" class="link-card">
          <div class="card-info card-link">
            🛒 Tienda
          </div>
        </a>
      </div>

      <div class="col-md-3 col-12">
        <a href="inventario.html" class="link-card">
          <div class="card-info card-link">
            🎒 Inventario
          </div>
        </a>
      </div>

    </section>

    <!-- JUEGO -->
    <section class="zona-juego text-center">

      <canvas
        id="canvasJuego"
        width="500"
        height="500"
      ></canvas>

    </section>

    <!-- CONTROLES -->
    <section class="controles mt-4">

      <div class="fila-control">
        <button class="vacio"></button>

        <button onclick="cambiarDireccion('arriba')">
          ⬆️
        </button>

        <button class="vacio"></button>
      </div>

      <div class="fila-control">

        <button onclick="cambiarDireccion('izquierda')">
          ⬅️
        </button>

        <button onclick="pausarJuego()">
          ⏸️
        </button>

        <button onclick="cambiarDireccion('derecha')">
          ➡️
        </button>

      </div>

      <div class="fila-control">

        <button class="vacio"></button>

        <button onclick="cambiarDireccion('abajo')">
          ⬇️
        </button>

        <button class="vacio"></button>

      </div>

    </section>

    <!-- ACCIONES -->
    <section class="acciones text-center mt-4">

      <button
        class="btn-jugar"
        onclick="iniciarJuego()"
      >
        ▶ Iniciar
      </button>

      <button
        class="btn-reiniciar"
        onclick="reiniciarJuego()"
      >
        🔄 Reiniciar
      </button>

    </section>

    <p id="mensaje" class="mensaje text-center mt-4">
      Presiona iniciar para comenzar.
    </p>

  </main>

  <script src="assets/js/serpiente.js"></script>

</body>
</html>
