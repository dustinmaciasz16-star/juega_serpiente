<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda de la Serpiente</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="assets/css/tienda.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark barra-superior">
    <div class="container">

      <a class="navbar-brand fw-bold" href="#">
        🐍 Snake Store
      </a>

      <a href="index.html" class="btn btn-outline-light rounded-pill px-4">
        Volver al juego
      </a>

    </div>
  </nav>

  <main class="container py-5">

    <section class="encabezado text-center mb-5">

      <h1 class="titulo-principal mb-3">
        🛒 Tienda de Skins
      </h1>

      <p class="descripcion-principal mx-auto">
        Personaliza tu serpiente con diferentes colores, combinaciones y estilos especiales.
      </p>

    </section>

    <!-- CABEZAS -->
    <section class="mb-5">

      <div class="d-flex align-items-center gap-3 mb-4">
        <div class="linea"></div>
        <h2 class="titulo-seccion">🎯 Cabezas</h2>
      </div>

      <div id="tiendaCabeza" class="contenedor-cards"></div>

    </section>

    <!-- CUERPOS -->
    <section class="mb-5">

      <div class="d-flex align-items-center gap-3 mb-4">
        <div class="linea"></div>
        <h2 class="titulo-seccion">🐍 Cuerpos</h2>
      </div>

      <div id="tiendaCuerpo" class="contenedor-cards"></div>

    </section>

    <!-- COMBOS -->
    <section class="mb-5">

      <div class="d-flex align-items-center gap-3 mb-4">
        <div class="linea"></div>
        <h2 class="titulo-seccion">✨ Combos</h2>
      </div>

      <div id="tiendaCombo" class="contenedor-cards"></div>

    </section>

    <!-- MULTICOLOR -->
    <section class="mb-5">

      <div class="d-flex align-items-center gap-3 mb-4">
        <div class="linea"></div>
        <h2 class="titulo-seccion">🌈 Multicolor</h2>
      </div>

      <div id="tiendaMulticolor" class="contenedor-cards"></div>

    </section>

  </main>

  <script src="assets/js/tienda.js"></script>
  <script src="assets/js/compraTienda.js"></script>
  <script src="assets/js/audio.js"></script>

</body>
</html>
