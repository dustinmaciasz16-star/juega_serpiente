<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Inventario - Snake Game</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- CSS -->
  <link rel="stylesheet" href="assets/css/inventario.css">

</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark barra-superior">

    <div class="container">

      <a class="navbar-brand fw-bold" href="#">
        🎒 Inventario Snake
      </a>

      <div class="d-flex gap-3">

        <a
          href="index.html"
          class="btn btn-outline-light rounded-pill px-4"
        >
          Juego
        </a>

        <a
          href="tienda.html"
          class="btn btn-primary rounded-pill px-4"
        >
          Tienda
        </a>

      </div>

    </div>

  </nav>

  <!-- CONTENIDO -->
  <main class="container py-5">

    <!-- ENCABEZADO -->
    <section class="text-center mb-5">

      <h1 class="titulo-principal mb-3">
        🎒 Inventario
      </h1>

      <p class="descripcion-principal mx-auto">
        Aquí puedes visualizar y equipar todas las skins
        desbloqueadas para tu serpiente.
      </p>

    </section>

    <!-- CABEZAS -->
    <section class="mb-5">

      <div class="d-flex align-items-center gap-3 mb-4">

        <div class="linea"></div>

        <h2 class="titulo-seccion">
          🎯 Cabezas
        </h2>

      </div>

      <div
        id="inventarioCabeza"
        class="contenedor-cards"
      ></div>

    </section>

    <!-- CUERPOS -->
    <section class="mb-5">

      <div class="d-flex align-items-center gap-3 mb-4">

        <div class="linea"></div>

        <h2 class="titulo-seccion">
          🐍 Cuerpos
        </h2>

      </div>

      <div
        id="inventarioCuerpo"
        class="contenedor-cards"
      ></div>

    </section>

    <!-- COMBOS -->
    <section class="mb-5">

      <div class="d-flex align-items-center gap-3 mb-4">

        <div class="linea"></div>

        <h2 class="titulo-seccion">
          ✨ Combos
        </h2>

      </div>

      <div
        id="inventarioCombo"
        class="contenedor-cards"
      ></div>

    </section>

    <!-- MULTICOLOR -->
    <section class="mb-5">

      <div class="d-flex align-items-center gap-3 mb-4">

        <div class="linea"></div>

        <h2 class="titulo-seccion">
          🌈 Multicolor
        </h2>

      </div>

      <div
        id="inventarioMulticolor"
        class="contenedor-cards"
      ></div>

    </section>

  </main>

  <script src="assets/js/inventario.js"></script>
  <script src="assets/js/audio.js"></script>

</body>
</html>
